# 非敏感配置（敏感项如 API Key / Base URL 请配置在 .env，勿写在本文件）
llm:
  model: mock            # 真实调用时改为具体模型名；.env 中 LLM_MODEL 优先
  max_tokens: 2048
  temperature: 0.2

rate_limit:
  base_delay: 1.0
  max_retries: 2

retrieval:
  top_k: 5
  fts_weight: 0.5
  vector_weight: 0.5
  chunk_size: 512
  chunk_overlap: 64
  vector_backend: chroma # chroma | simple（chromadb 未安装时自动回退 simple）
  embedding_model: ""    # 留空=内置特征哈希向量；填 OpenAI 兼容 embedding 模型名即用真实向量

agent:
  max_steps: 10
  tool_retries: 2

content:
  retries: 3